<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj wydarzenie — Platforma Wydarzeń</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-calendar-event me-2"></i>Platforma Wydarzeń
      </a>
      <div class="ms-auto d-flex gap-2">
        <span id="nav-user" class="text-white small align-self-center"></span>
        <a href="/" class="btn btn-outline-light btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Powrót
        </a>
        <button class="btn btn-outline-light btn-sm" onclick="wyloguj()">
          <i class="bi bi-box-arrow-right me-1"></i>Wyloguj
        </button>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 680px;">
    <h2 class="mb-4"><i class="bi bi-plus-circle me-2 text-primary"></i>Dodaj nowe wydarzenie</h2>

    <div id="success-msg" class="alert alert-success d-none"></div>
    <div id="error-msg" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form id="create-form" novalidate>
          <div class="mb-3">
            <label for="title" class="form-label fw-semibold">Tytuł <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" required maxlength="200"
                   placeholder="np. Koncert jazzowy w parku">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label fw-semibold">Opis</label>
            <textarea class="form-control" id="description" rows="4" placeholder="Opisz wydarzenie..."></textarea>
          </div>
          <div class="mb-3">
            <label for="category" class="form-label fw-semibold">Kategoria <span class="text-danger">*</span></label>
            <select class="form-select" id="category" required>
              <option value="cultural">Kulturalne</option>
              <option value="sports">Sportowe</option>
              <option value="educational">Edukacyjne</option>
            </select>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="date" class="form-label fw-semibold">Data i godzina <span class="text-danger">*</span></label>
              <input type="datetime-local" class="form-control" id="date" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="max_participants" class="form-label fw-semibold">Maks. uczestników <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="max_participants" min="1" value="50" required>
            </div>
          </div>
          <div class="mb-4">
            <label for="location" class="form-label fw-semibold">Miejsce <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="location" required maxlength="300"
                   placeholder="np. Park Miejski, Rzeszów">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4" id="submit-btn">
              <i class="bi bi-check-circle me-1"></i>Utwórz wydarzenie
            </button>
            <a href="/" class="btn btn-outline-secondary">Anuluj</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Guard — przekieruj na login jeśli nie zalogowany
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    }

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('nav-user').textContent = user.username ? `Zalogowany: ${user.username}` : '';

    function wyloguj() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    }

    const form = document.getElementById('create-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

      const dane = {
        title:            document.getElementById('title').value.trim(),
        description:      document.getElementById('description').value.trim(),
        category:         document.getElementById('category').value,
        date:             document.getElementById('date').value,
        location:         document.getElementById('location').value.trim(),
        max_participants: parseInt(document.getElementById('max_participants').value)
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Tworzenie...';

      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`   // Token JWT w nagłówku
          },
          body: JSON.stringify(dane)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        document.getElementById('success-msg').textContent = `Wydarzenie "${data.title}" zostało utworzone!`;
        document.getElementById('success-msg').classList.remove('d-none');
        setTimeout(() => { window.location.href = '/'; }, 1500);

      } catch (err) {
        document.getElementById('error-msg').textContent = 'Błąd: ' + err.message;
        document.getElementById('error-msg').classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Utwórz wydarzenie';
      }
    });
  </script>
</body>
</html>
