<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szczegóły wydarzenia — Platforma Wydarzeń</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-calendar-event me-2"></i>Platforma Wydarzeń
      </a>
      <div class="ms-auto d-flex gap-2">
        <span id="nav-user" class="text-white small align-self-center"></span>
        <a href="/" class="btn btn-outline-light btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Wszystkie wydarzenia
        </a>
        <button id="btn-logout" class="btn btn-outline-light btn-sm d-none" onclick="wyloguj()">
          <i class="bi bi-box-arrow-right me-1"></i>Wyloguj
        </button>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 760px;">
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Ładowanie...</p>
    </div>
    <div id="error-msg" class="alert alert-danger d-none"></div>

    <div id="event-details" class="d-none">
      <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
            <span id="event-badge" class="badge fs-6"></span>
            <span id="event-spaces" class="badge fs-6"></span>
          </div>
          <h2 id="event-title" class="mb-3"></h2>
          <p id="event-description" class="text-muted mb-4"></p>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <div class="d-flex align-items-center text-muted">
                <i class="bi bi-calendar3 fs-5 me-2 text-primary"></i>
                <div><div class="small fw-semibold text-dark">Data i godzina</div>
                <div id="event-date"></div></div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="d-flex align-items-center text-muted">
                <i class="bi bi-geo-alt fs-5 me-2 text-primary"></i>
                <div><div class="small fw-semibold text-dark">Miejsce</div>
                <div id="event-location"></div></div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="d-flex align-items-center text-muted">
                <i class="bi bi-people fs-5 me-2 text-primary"></i>
                <div><div class="small fw-semibold text-dark">Dostępność</div>
                <div id="event-capacity"></div></div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="d-flex align-items-center text-muted">
                <i class="bi bi-person fs-5 me-2 text-primary"></i>
                <div><div class="small fw-semibold text-dark">Organizator</div>
                <div id="event-creator"></div></div>
              </div>
            </div>
          </div>

          <!-- Przyciski dla twórcy i admina -->
          <div id="owner-actions" class="d-none d-flex gap-2 mt-3">
            <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editModal">
              <i class="bi bi-pencil me-1"></i>Edytuj
            </button>
            <button class="btn btn-danger btn-sm" onclick="usunWydarzenie()">
              <i class="bi bi-trash me-1"></i>Usuń
            </button>
          </div>
        </div>
      </div>

      <!-- Formularz rejestracji -->
      <div id="registration-section" class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="mb-4"><i class="bi bi-person-plus me-2 text-primary"></i>Zarejestruj się</h4>
          <div id="no-spaces-alert" class="alert alert-warning d-none">
            <i class="bi bi-exclamation-triangle me-1"></i>Brak wolnych miejsc.
          </div>
          <div id="login-required-alert" class="alert alert-info d-none">
            <i class="bi bi-info-circle me-1"></i>
            <a href="login.html">Zaloguj się</a>, aby zarejestrować się na wydarzenie.
          </div>
          <div id="reg-success" class="alert alert-success d-none"></div>
          <div id="reg-error" class="alert alert-danger d-none"></div>
          <form id="register-form" novalidate>
            <div class="mb-3">
              <label for="reg-name" class="form-label fw-semibold">Imię i nazwisko <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="reg-name" required maxlength="200">
            </div>
            <div class="mb-4">
              <label for="reg-email" class="form-label fw-semibold">Adres e-mail <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="reg-email" required>
            </div>
            <button type="submit" class="btn btn-success px-4" id="reg-btn">
              <i class="bi bi-check-circle me-1"></i>Zarejestruj się
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal edycji -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edytuj wydarzenie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="edit-error" class="alert alert-danger d-none"></div>
          <form id="edit-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Tytuł</label>
              <input type="text" class="form-control" id="edit-title" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Opis</label>
              <textarea class="form-control" id="edit-description" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Kategoria</label>
              <select class="form-select" id="edit-category">
                <option value="cultural">Kulturalne</option>
                <option value="sports">Sportowe</option>
                <option value="educational">Edukacyjne</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Data i godzina</label>
              <input type="datetime-local" class="form-control" id="edit-date" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Miejsce</label>
              <input type="text" class="form-control" id="edit-location" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Maks. uczestników</label>
              <input type="number" class="form-control" id="edit-max" min="1" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
          <button type="button" class="btn btn-warning" onclick="zapiszEdycje()">
            <i class="bi bi-check me-1"></i>Zapisz zmiany
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-4 mt-5 border-top">
    <small>Platforma Wydarzeń Lokalnych &copy; 2026 — Projekt PRz</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const kategorie = {
      cultural:    { label: 'Kulturalne',  cls: 'bg-primary' },
      sports:      { label: 'Sportowe',    cls: 'bg-success' },
      educational: { label: 'Edukacyjne',  cls: 'bg-warning text-dark' }
    };

    function formatujDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString('pl-PL', {
        weekday: 'long', year: 'numeric', month: 'long',
        day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    function wyloguj() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    }

    const params  = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    const token   = localStorage.getItem('token');
    const user    = JSON.parse(localStorage.getItem('user') || 'null');
    let currentEvent = null;

    // Aktualizacja nawigacji
    if (user) {
      document.getElementById('nav-user').textContent = `Cześć, ${user.username}!`;
      document.getElementById('btn-logout').classList.remove('d-none');
    }

    if (!eventId) {
      document.getElementById('loading').classList.add('d-none');
      document.getElementById('error-msg').textContent = 'Brak ID wydarzenia.';
      document.getElementById('error-msg').classList.remove('d-none');
    } else {
      ladujSzczegoly();
    }

    async function ladujSzczegoly() {
      try {
        const res = await fetch(`/api/events/${eventId}`);
        if (!res.ok) throw new Error(res.status === 404 ? 'Wydarzenie nie istnieje.' : `HTTP ${res.status}`);
        currentEvent = await res.json();

        document.title = `${currentEvent.title} — Platforma Wydarzeń`;

        const kat = kategorie[currentEvent.category] || { label: currentEvent.category, cls: 'bg-secondary' };
        document.getElementById('event-badge').textContent = kat.label;
        document.getElementById('event-badge').className = `badge fs-6 ${kat.cls}`;

        const brakMiejsc = currentEvent.free_spaces <= 0;
        const spacesEl = document.getElementById('event-spaces');
        spacesEl.textContent = brakMiejsc ? 'Brak miejsc' : `${currentEvent.free_spaces} wolnych miejsc`;
        spacesEl.className = `badge fs-6 ${brakMiejsc ? 'bg-danger' : 'bg-success'}`;

        document.getElementById('event-title').textContent = currentEvent.title;
        document.getElementById('event-description').textContent = currentEvent.description || 'Brak opisu.';
        document.getElementById('event-date').textContent = formatujDate(currentEvent.date);
        document.getElementById('event-location').textContent = currentEvent.location;
        document.getElementById('event-capacity').textContent =
          `${currentEvent.free_spaces} / ${currentEvent.max_participants} miejsc`;
        document.getElementById('event-creator').textContent =
          currentEvent.creator_name || 'Nieznany';

        // Przyciski edycji/usuwania — dla twórcy lub admina
        if (user && (user.id === currentEvent.creator_id || user.role === 'admin')) {
          document.getElementById('owner-actions').classList.remove('d-none');
          // Wypełnij formularz edycji
          document.getElementById('edit-title').value = currentEvent.title;
          document.getElementById('edit-description').value = currentEvent.description || '';
          document.getElementById('edit-category').value = currentEvent.category;
          document.getElementById('edit-date').value = currentEvent.date;
          document.getElementById('edit-location').value = currentEvent.location;
          document.getElementById('edit-max').value = currentEvent.max_participants;
        }

        // Obsługa formularza rejestracji
        if (brakMiejsc) {
          document.getElementById('no-spaces-alert').classList.remove('d-none');
          document.getElementById('register-form').style.display = 'none';
        } else if (!token) {
          // Niezalogowany — pokaż alert z linkiem do logowania
          document.getElementById('login-required-alert').classList.remove('d-none');
          document.getElementById('register-form').style.display = 'none';
        } else {
          // Zalogowany — prefill imienia i emaila
          if (user) {
            document.getElementById('reg-email').value = user.email || '';
          }
        }

        document.getElementById('loading').classList.add('d-none');
        document.getElementById('event-details').classList.remove('d-none');

      } catch (err) {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('error-msg').textContent = 'Błąd: ' + err.message;
        document.getElementById('error-msg').classList.remove('d-none');
      }
    }

    // Rejestracja na wydarzenie
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name  = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const regBtn = document.getElementById('reg-btn');

      regBtn.disabled = true;
      regBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Rejestruję...';
      document.getElementById('reg-success').classList.add('d-none');
      document.getElementById('reg-error').classList.add('d-none');

      try {
        const res = await fetch(`/api/events/${eventId}/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, email })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        document.getElementById('reg-success').textContent = data.message;
        document.getElementById('reg-success').classList.remove('d-none');
        document.getElementById('register-form').style.display = 'none';
        ladujSzczegoly(); // odśwież licznik miejsc

      } catch (err) {
        document.getElementById('reg-error').textContent = err.message;
        document.getElementById('reg-error').classList.remove('d-none');
        regBtn.disabled = false;
        regBtn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Zarejestruj się';
      }
    });

    // Usuwanie wydarzenia
    async function usunWydarzenie() {
      if (!confirm(`Czy na pewno chcesz usunąć "${currentEvent.title}"?`)) return;

      try {
        const res = await fetch(`/api/events/${eventId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        alert(data.message);
        window.location.href = '/';
      } catch (err) {
        alert('Błąd: ' + err.message);
      }
    }

    // Zapis edycji
    async function zapiszEdycje() {
      document.getElementById('edit-error').classList.add('d-none');
      try {
        const res = await fetch(`/api/events/${eventId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            title:            document.getElementById('edit-title').value.trim(),
            description:      document.getElementById('edit-description').value.trim(),
            category:         document.getElementById('edit-category').value,
            date:             document.getElementById('edit-date').value,
            location:         document.getElementById('edit-location').value.trim(),
            max_participants: parseInt(document.getElementById('edit-max').value)
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        ladujSzczegoly(); // odśwież dane po edycji
      } catch (err) {
        document.getElementById('edit-error').textContent = err.message;
        document.getElementById('edit-error').classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
