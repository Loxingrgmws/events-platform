<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platforma Wydarzeń Lokalnych</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Nawigacja -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-calendar-event me-2"></i>Platforma Wydarzeń
      </a>
      <a href="create.html" class="btn btn-light btn-sm ms-auto">
        <i class="bi bi-plus-circle me-1"></i>Dodaj wydarzenie
      </a>
    </div>
  </nav>

  <!-- Treść główna -->
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Nadchodzące wydarzenia</h2>
      <span id="events-count" class="badge bg-secondary fs-6"></span>
    </div>

    <!-- Stan ładowania -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Ładowanie wydarzeń...</p>
    </div>

    <!-- Komunikat błędu -->
    <div id="error-msg" class="alert alert-danger d-none"></div>

    <!-- Siatka kart wydarzeń -->
    <div id="events-grid" class="row g-4"></div>
  </div>

  <footer class="text-center text-muted py-4 mt-5 border-top">
    <small>Platforma Wydarzeń Lokalnych &copy; 2026 — Projekt PRz</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mapowanie kategorii na etykiety i kolory Bootstrap
    const kategorie = {
      cultural:    { label: 'Kulturalne',   cls: 'bg-primary' },
      sports:      { label: 'Sportowe',     cls: 'bg-success' },
      educational: { label: 'Edukacyjne',   cls: 'bg-warning text-dark' }
    };

    // Formatowanie daty na czytelny format polski
    function formatujDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString('pl-PL', {
        weekday: 'long', year: 'numeric', month: 'long',
        day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    // Budowanie karty HTML dla jednego wydarzenia
    function budujKarte(event) {
      const kat = kategorie[event.category] || { label: event.category, cls: 'bg-secondary' };
      const wolne = event.free_spaces;
      const brakMiejsc = wolne <= 0;

      return `
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm event-card">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge ${kat.cls}">${kat.label}</span>
                <span class="badge ${brakMiejsc ? 'bg-danger' : 'bg-light text-dark border'}">
                  ${brakMiejsc ? 'Brak miejsc' : `${wolne} miejsc`}
                </span>
              </div>
              <h5 class="card-title">${escapeHtml(event.title)}</h5>
              <p class="card-text text-muted small flex-grow-1">
                ${escapeHtml(event.description || '')}
              </p>
              <div class="text-muted small mb-3">
                <div><i class="bi bi-calendar3 me-1"></i>${formatujDate(event.date)}</div>
                <div><i class="bi bi-geo-alt me-1"></i>${escapeHtml(event.location)}</div>
              </div>
              <a href="event.html?id=${event.id}"
                 class="btn btn-primary btn-sm mt-auto ${brakMiejsc ? 'btn-secondary' : ''}">
                ${brakMiejsc ? 'Zobacz szczegóły' : 'Szczegóły i rejestracja'}
              </a>
            </div>
          </div>
        </div>
      `;
    }

    // Zabezpieczenie przed XSS — escapowanie znaków HTML
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Pobieranie i wyświetlanie listy wydarzeń
    async function ladujWydarzenia() {
      try {
        const res = await fetch('/api/events');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const events = await res.json();

        document.getElementById('loading').classList.add('d-none');
        document.getElementById('events-count').textContent = `${events.length} wydarzeń`;

        if (events.length === 0) {
          document.getElementById('events-grid').innerHTML =
            '<p class="text-muted text-center py-5">Brak wydarzeń. <a href="create.html">Dodaj pierwsze!</a></p>';
          return;
        }

        document.getElementById('events-grid').innerHTML = events.map(budujKarte).join('');
      } catch (err) {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('error-msg').textContent = 'Nie udało się załadować wydarzeń: ' + err.message;
        document.getElementById('error-msg').classList.remove('d-none');
      }
    }

    ladujWydarzenia();
  </script>
</body>
</html>
