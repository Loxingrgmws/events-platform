# GitHub Actions — automatyczne wdrożenie na AWS EC2
# Uruchamiane przy każdym push na gałąź main
#
# Wymagane sekrety w ustawieniach repozytorium (Settings → Secrets):
#   EC2_HOST       — publiczny adres IP instancji EC2
#   EC2_USERNAME   — nazwa użytkownika SSH (zwykle: ubuntu)
#   EC2_SSH_KEY    — prywatny klucz SSH (zawartość pliku .pem)

name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie kodu z repozytorium
      - name: Checkout kodu
        uses: actions/checkout@v4

      # 2. Połączenie SSH z EC2 i wdrożenie
      - name: Deploy przez SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/events-platform

            # Pobranie najnowszego kodu
            git pull origin main

            # Aktualizacja zależności (tylko produkcyjne)
            npm install --production

            # Restart aplikacji przez PM2
            pm2 restart events-platform || pm2 start server.js --name events-platform

            # Zapisanie stanu PM2
            pm2 save

            echo "Wdrożenie zakończone: $(date)"
